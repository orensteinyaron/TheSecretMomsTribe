name: System Orchestrator

on:
  # Manual trigger only. The */15 cron was removed 2026-08-16: GitHub fired it
  # roughly every 28 min, and every pipeline run calls 4 Apify actors from
  # agents/research.js (2x reddit, tiktok, google-trends) at ~$0.52 a cycle.
  # That ran to $50 of Apify spend in 3 days against a $100 plan limit.
  # Before restoring any schedule, rate-limit the research stage first.
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node agents/orchestrator.js
